<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Muhasebe</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Renkler Telegram temasından gelir (açık/koyu tema otomatik); dışarıda açılırsa yedek değerler */
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f1f2f6);
    --text: var(--tg-theme-text-color, #1c1c1e);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --expense: #e5484d;
    --income: #2f9e44;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { padding: 16px; max-width: 520px; margin: 0 auto; padding-bottom: 96px; }
  label.cap { display: block; font-size: 13px; color: var(--hint); margin: 18px 4px 8px;
    text-transform: uppercase; letter-spacing: .04em; }

  /* Gider / Gelir */
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--bg2);
    border-radius: var(--radius); padding: 4px; }
  .seg button { border: 0; border-radius: 11px; padding: 11px 0; font-size: 16px; font-weight: 600;
    background: transparent; color: var(--hint); cursor: pointer; }
  .seg button[aria-pressed="true"][data-kind="Gider"] { background: var(--expense); color: #fff; }
  .seg button[aria-pressed="true"][data-kind="Gelir"] { background: var(--income); color: #fff; }

  /* Tutar */
  .amount { display: flex; align-items: center; background: var(--bg2); border-radius: var(--radius);
    padding: 6px 16px; border: 2px solid transparent; }
  .amount:focus-within { border-color: var(--accent); }
  .amount input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--text);
    font-size: 34px; font-weight: 700; padding: 8px 0; outline: none; }
  .amount span { font-size: 26px; color: var(--hint); font-weight: 600; }
  .preview { margin: 6px 4px 0; font-size: 13px; color: var(--hint); min-height: 18px; }

  input.field { width: 100%; border: 2px solid transparent; background: var(--bg2); color: var(--text);
    border-radius: var(--radius); padding: 14px 16px; font-size: 16px; outline: none; }
  input.field:focus { border-color: var(--accent); }

  /* Sekme seçimi */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 2px solid var(--bg2); background: var(--bg2); color: var(--text); border-radius: 999px;
    padding: 9px 16px; font-size: 15px; cursor: pointer; max-width: 100%; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-text); }
  .chip.new { border-style: dashed; border-color: var(--hint); background: transparent; color: var(--hint); }
  .chip.new[aria-pressed="true"] { border-style: solid; border-color: var(--accent); color: var(--accent); }
  #newSheetWrap { margin-top: 10px; display: none; }
  .empty { color: var(--hint); font-size: 14px; margin: 0 4px 10px; }

  /* Telegram dışında açılınca görünen yedek buton */
  #fallbackBtn { display: none; position: fixed; left: 16px; right: 16px; bottom: 16px; border: 0;
    border-radius: var(--radius); padding: 16px; font-size: 17px; font-weight: 600;
    background: var(--accent); color: var(--accent-text); }
  #fallbackBtn:disabled { opacity: .45; }
  #notice { display: none; margin-top: 18px; padding: 12px 14px; border-radius: 12px; background: var(--bg2);
    color: var(--hint); font-size: 13px; word-break: break-all; }
</style>
</head>
<body>
<main>
  <div class="seg" role="group" aria-label="Kayıt türü">
    <button type="button" data-kind="Gider" aria-pressed="true">Gider</button>
    <button type="button" data-kind="Gelir" aria-pressed="false">Gelir</button>
  </div>

  <label class="cap" for="amount">Tutar</label>
  <div class="amount">
    <input id="amount" inputmode="decimal" autocomplete="off" placeholder="0,00" aria-label="Tutar">
    <span>₺</span>
  </div>
  <div class="preview" id="preview"></div>

  <label class="cap" for="desc">Açıklama</label>
  <input class="field" id="desc" maxlength="200" autocomplete="off" placeholder="Örn. A101, banyo musluğu">

  <label class="cap">Sekme</label>
  <p class="empty" id="emptyMsg" hidden>Henüz sekme yok — yeni bir tane oluşturun.</p>
  <div class="chips" id="chips"></div>
  <div id="newSheetWrap">
    <input class="field" id="newSheet" maxlength="100" autocomplete="off" placeholder="Yeni sekme adı (örn. Borclar)">
  </div>

  <div id="notice"></div>
</main>
<button id="fallbackBtn" type="button" disabled>Kaydet</button>

<script>
(function () {
  "use strict";
  var tg = window.Telegram && window.Telegram.WebApp;
  var inTelegram = !!(tg && tg.initData);  // Telegram dışında açılınca initData boştur

  var state = { kind: "Gider", sheet: null, isNew: false };
  var $ = function (id) { return document.getElementById(id); };

  // --- Sekme listesi: bot, butonun adresine ?sheets=["Kasa","Borclar"] olarak ekler ---
  var sheets = [];
  try {
    var raw = new URLSearchParams(location.search).get("sheets");
    var parsed = raw ? JSON.parse(raw) : [];
    if (Array.isArray(parsed)) sheets = parsed.filter(function (s) { return typeof s === "string" && s; });
  } catch (e) { sheets = []; }

  var lastSheet = null;
  try { lastSheet = localStorage.getItem("lastSheet"); } catch (e) {}

  // --- Tutar ayrıştırma (main.py'deki parse_number ile aynı kurallar) ---
  function parseAmount(str) {
    var s = String(str).replace(/[\s₺]/g, "").replace(/tl$/i, "");
    if (!/^\d[\d.,]*$/.test(s)) return null;
    if (s.indexOf(".") > -1 && s.indexOf(",") > -1) {
      var dec = s.lastIndexOf(".") > s.lastIndexOf(",") ? "." : ",";
      var thou = dec === "." ? "," : ".";
      s = s.split(thou).join("").replace(dec, ".");
    } else if (s.indexOf(",") > -1) {
      var p = s.split(",");
      s = (p.length === 2 && p[1].length >= 1 && p[1].length <= 2) ? p[0] + "." + p[1] : s.split(",").join("");
    } else if (s.indexOf(".") > -1) {
      var q = s.split(".");
      if (q.length > 2 || q[1].length === 3) s = s.split(".").join("");
    }
    var v = parseFloat(s);
    return isFinite(v) && v > 0 ? Math.round(v * 100) / 100 : null;
  }
  function fmt(v) {
    return v.toLocaleString("tr-TR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " ₺";
  }

  // --- Sekme çipleri ---
  function renderChips() {
    var box = $("chips");
    box.innerHTML = "";
    sheets.forEach(function (name) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = name;
      b.setAttribute("aria-pressed", String(!state.isNew && state.sheet === name));
      b.onclick = function () { state.sheet = name; state.isNew = false; haptic(); update(); };
      box.appendChild(b);
    });
    var n = document.createElement("button");
    n.type = "button"; n.className = "chip new"; n.textContent = "➕ Yeni sekme";
    n.setAttribute("aria-pressed", String(state.isNew));
    n.onclick = function () { state.isNew = true; haptic(); update(); setTimeout(function () { $("newSheet").focus(); }, 50); };
    box.appendChild(n);
    $("emptyMsg").hidden = sheets.length > 0;
    $("newSheetWrap").style.display = state.isNew ? "block" : "none";
  }

  function haptic() { try { tg && tg.HapticFeedback.selectionChanged(); } catch (e) {} }

  // --- Form durumu ---
  function payload() {
    var amount = parseAmount($("amount").value);
    var sheet = state.isNew ? $("newSheet").value.trim().replace(/\s+/g, " ") : state.sheet;
    if (!amount || !sheet) return null;
    return {
      v: 1,
      type: state.kind,
      amount: amount,
      desc: $("desc").value.trim(),
      sheet: sheet,
      "new": state.isNew
    };
  }

  function update() {
    document.querySelectorAll(".seg button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.kind === state.kind));
    });
    renderChips();
    var a = parseAmount($("amount").value);
    $("preview").textContent = $("amount").value && !a ? "Geçerli bir tutar girin" : (a ? fmt(a) : "");

    var p = payload();
    if (inTelegram) {
      var mb = tg.MainButton;
      mb.setText(p ? "Kaydet · " + fmt(p.amount) : "Kaydet");
      if (p) { mb.enable(); mb.show(); } else { mb.disable(); mb.show(); }
      try { p ? mb.setParams({ color: tg.themeParams.button_color, text_color: tg.themeParams.button_text_color })
              : mb.setParams({ color: "#9e9e9e", text_color: "#ffffff" }); } catch (e) {}
    } else {
      $("fallbackBtn").disabled = !p;
    }
  }

  function submit() {
    var p = payload();
    if (!p) return;
    try { localStorage.setItem("lastSheet", p.sheet); } catch (e) {}
    if (inTelegram) {
      try { tg.HapticFeedback.notificationOccurred("success"); } catch (e) {}
      tg.sendData(JSON.stringify(p));  // Veri bota gider, pencere kendiliğinden kapanır
    } else {
      var n = $("notice");
      n.style.display = "block";
      n.textContent = "Telegram dışında açıldı; veri gönderilmedi. Gönderilecek veri: " + JSON.stringify(p);
    }
  }

  // --- Olaylar ---
  document.querySelectorAll(".seg button").forEach(function (b) {
    b.onclick = function () { state.kind = b.dataset.kind; haptic(); update(); };
  });
  ["amount", "desc", "newSheet"].forEach(function (id) { $(id).addEventListener("input", update); });
  $("amount").addEventListener("keydown", function (e) { if (e.key === "Enter") $("desc").focus(); });
  $("desc").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.target.blur(); submit(); } });
  $("newSheet").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.target.blur(); submit(); } });

  // Varsayılan sekme: en son kullanılan ya da ilk sekme
  state.sheet = (lastSheet && sheets.indexOf(lastSheet) > -1) ? lastSheet : (sheets[0] || null);
  if (!sheets.length) state.isNew = true;

  if (inTelegram) {
    tg.ready();
    tg.expand();
    tg.MainButton.onClick(submit);
  } else {
    $("fallbackBtn").style.display = "block";
    $("fallbackBtn").onclick = submit;
    var n = $("notice");
    n.style.display = "block";
    n.textContent = "Önizleme modu: bu sayfa Telegram içinden açılmadığı için kayıt gönderemez.";
  }
  update();
  setTimeout(function () { $("amount").focus(); }, 150);
})();
</script>
</body>
</html>
